<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Learning Path</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --text3: #484f58;
      --green: #22c55e;
      --green-dark: #15803d;
      --green-bg: #0d2818;
      --red: #f87171;
      --blue: #60a5fa;
      --amber: #fbbf24;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px; min-height: 100vh; }
    .page-title { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: 0.05em; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .page-title span { color: var(--green); }

    .app { display: grid; grid-template-columns: 200px 1fr; width: 100%; max-width: 960px; height: calc(100vh - 70px); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

    /* Sidebar */
    .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sb-head { padding: 11px 14px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); }
    .sb-prog { padding: 8px 14px 7px; border-bottom: 1px solid var(--border); }
    .sb-prow { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 5px; }
    .prog-tr { height: 2px; background: var(--border); border-radius: 2px; }
    .prog-fl { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s ease; }
    .sb-cats { flex: 1; overflow-y: auto; padding: 4px 0; }
    .sb-cats::-webkit-scrollbar { width: 4px; } .sb-cats::-webkit-scrollbar-track { background: transparent; } .sb-cats::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-btn { display: flex; align-items: center; width: 100%; padding: 6px 12px; border: none; background: transparent; cursor: pointer; gap: 6px; border-right: 2px solid transparent; color: var(--text2); font-family: var(--font-sans); transition: all 0.15s; }
    .cat-btn:hover { background: var(--bg3); color: var(--text); }
    .cat-btn.active { background: var(--bg3); color: var(--text); font-weight: 500; border-right-color: var(--green); }
    .cat-name { flex: 1; text-align: left; font-size: 11.5px; }
    .cat-bd { font-size: 10px; padding: 1px 5px; border-radius: 10px; background: var(--bg3); color: var(--text3); white-space: nowrap; }
    .cat-bd.full { background: var(--green-bg); color: var(--green); }

    /* Main */
    .main { display: grid; grid-template-rows: 1fr 300px; overflow: hidden; background: #0d1117; }
    .ex-panel { overflow-y: auto; display: flex; flex-direction: column; }
    .ex-panel::-webkit-scrollbar { width: 4px; } .ex-panel::-webkit-scrollbar-track { background: transparent; } .ex-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #0d1117; z-index: 5; }
    .cat-head h2 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .cat-head p { font-size: 11px; color: var(--text2); }
    .ex-list { padding: 4px 0; }
    .ex-row { display: flex; align-items: center; gap: 8px; padding: 7px 16px; cursor: pointer; border-left: 2px solid transparent; font-size: 12px; transition: background 0.1s; }
    .ex-row:hover { background: var(--bg2); }
    .ex-row.active { background: var(--bg2); border-left-color: var(--text); }
    .ex-chk { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; transition: all 0.2s; }
    .ex-row.done .ex-chk { background: var(--green); border-color: var(--green); color: #fff; }
    .ex-lbl { flex: 1; font-family: var(--font-mono); font-size: 11.5px; color: var(--text); }
    .ex-row.done .ex-lbl { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--border); }
    .ex-btn { font-size: 11px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 5px; background: transparent; cursor: pointer; color: var(--text2); font-family: var(--font-sans); white-space: nowrap; transition: all 0.15s; }
    .ex-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--text3); }

    /* Terminal */
    .term { background: #090b0f; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
    .term-bar { display: flex; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1a1d26; flex-shrink: 0; gap: 8px; }
    .tdots { display: flex; gap: 5px; }
    .tdot { width: 10px; height: 10px; border-radius: 50%; }
    .t-r { background: #ff5f57; } .t-y { background: #febc2e; } .t-g { background: #28c840; }
    .term-lbl { flex: 1; text-align: center; font-size: 11px; color: #2a3040; font-family: var(--font-mono); }
    .term-body { flex: 1; overflow-y: auto; padding: 10px 16px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; cursor: text; }
    .term-body::-webkit-scrollbar { width: 4px; } .term-body::-webkit-scrollbar-track { background: transparent; } .term-body::-webkit-scrollbar-thumb { background: #1a1d26; border-radius: 2px; }
    .tl { display: flex; flex-wrap: wrap; }
    .tp { color: var(--green); white-space: pre; }
    .tc { color: #e2e8f0; white-space: pre-wrap; }
    .to { color: #6b7a96; white-space: pre-wrap; display: block; }
    .to.ok { color: var(--green); }
    .to.err { color: var(--red); }
    .to.hint { color: var(--blue); border-left: 2px solid #1e3a5f; padding-left: 8px; margin: 3px 0; }
    .to.sol { color: var(--amber); border-left: 2px solid #451a03; padding-left: 8px; margin: 3px 0; }
    .to.ctx { color: #2e3d4a; font-size: 11px; margin-bottom: 8px; font-style: italic; }
    .term-inp { display: flex; align-items: center; padding: 7px 16px; border-top: 1px solid #1a1d26; gap: 8px; flex-shrink: 0; }
    .pr-cur { color: var(--green); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    #cmd-in { flex: 1; background: transparent; border: none; outline: none; color: #e2e8f0; font-family: var(--font-mono); font-size: 12px; caret-color: var(--green); min-width: 0; }
    .term-foot { display: flex; align-items: center; gap: 6px; padding: 5px 16px; border-top: 1px solid #13151d; background: #060810; flex-shrink: 0; }
    .tf { font-size: 11px; padding: 2px 9px; border-radius: 4px; border: 1px solid #1e2535; background: transparent; color: #3a4556; cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; }
    .tf:hover { border-color: #364050; color: #7a8fa8; background: #0c0f16; }
    .tf:disabled { opacity: 0.25; cursor: default; }
    .tf.nx { border-color: var(--green); color: var(--green); margin-left: auto; }
    .tf.nx:hover { background: var(--green-bg); }
    .tf-st { font-size: 11px; font-family: var(--font-mono); color: #2a3040; margin-left: auto; }
    .tf-st.ok { color: var(--green); }
    .tf-st.err { color: var(--red); }
    .et { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #1a2030; font-family: var(--font-mono); font-size: 12px; gap: 4px; }
  </style>
</head>

<div class="page-title">terminal-learning-path <span>▸</span> bash essentials</div>

        <span class="tf-st" id="t-st"></span>
        <button class="tf nx" id="b-nx" onclick="doNext()" style="display:none">Suivant →</button>
      </div>
    </div>
  </div>
</div>

const S = { catId:null, exId:null, done:new Set(), cmds:[], hidx:-1, lines:[] };
const exMap={}, catMap={};
CATS.forEach(c => { catMap[c.id]=c; c.exercises.forEach(e => exMap[e.id]=e); });
const total = CATS.reduce((n,c)=>n+c.exercises.length,0);

function fp(cwd) {
  const H='/home/john_doe';
  const d = cwd===H?'~':cwd.startsWith(H+'/')?'~'+cwd.slice(H.length):cwd;
  return `john_doe@machine:${d}$`;
}
function nrm(s){return s.trim().replace(/\s+/g,' ');}
function ok(inp,ex){return ex.answers.some(a=>nrm(a)===nrm(inp));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function rSidebar() {
  document.getElementById('sb-cats').innerHTML = CATS.map(c=>{
    const d=c.exercises.filter(e=>S.done.has(e.id)).length;
    const f=d===c.exercises.length;
    return `<button class="cat-btn${S.catId===c.id?' active':''}" onclick="selCat('${c.id}')"><span class="cat-name">${c.label}</span><span class="cat-bd${f?' full':''}">${d}/${c.exercises.length}</span></button>`;
  }).join('');
  const d=S.done.size;
  document.getElementById('p-txt').textContent=`${d} / ${total}`;
  document.getElementById('p-fl').style.width=(d/total*100)+'%';
}

function rExList() {
  const cat=catMap[S.catId]; if(!cat)return;
  document.getElementById('cat-h2').textContent=cat.label;
  document.getElementById('cat-p').textContent=cat.desc;
  document.getElementById('ex-list').innerHTML=cat.exercises.map(e=>{
    const done=S.done.has(e.id), active=S.exId===e.id;
    return `<div class="ex-row${active?' active':''}${done?' done':''}" onclick="selEx('${e.id}')">
      <div class="ex-chk">${done?'✓':''}</div>
      <span class="ex-lbl">${e.title}</span>
      <button class="ex-btn" onclick="event.stopPropagation();selEx('${e.id}')">${done?'↻':'Commencer'}</button>
    </div>`;
  }).join('');
}

function rTerm() {
  const ex=exMap[S.exId];
  const inp=document.getElementById('cmd-in');
  const body=document.getElementById('t-body');
  ['b-hint','b-sol','b-rst'].forEach(id=>document.getElementById(id).disabled=!ex);
  inp.disabled=!ex;
  if(!ex){
    document.getElementById('pr-cur').textContent='$';
    document.getElementById('t-lbl').textContent='bash';
    body.innerHTML='<div class="et"><span>$ _</span><span style="font-size:11px;color:#111820;margin-top:4px">Choisissez un exercice ci-dessus</span></div>';
    return;
  }
  document.getElementById('t-lbl').textContent=`bash — ${ex.title}`;
  document.getElementById('pr-cur').textContent=fp(ex.cwd)+' ';
  let h=`<div class="to ctx">◎ ${esc(ex.desc)}</div>`;
  S.lines.forEach(l=>{
    if(l.t==='cmd') h+=`<div class="tl"><span class="tp">${esc(fp(ex.cwd))}&nbsp;</span><span class="tc">${esc(l.v)}</span></div>`;
    else { const c=l.t==='ok'?' ok':l.t==='err'?' err':l.t==='hint'?' hint':l.t==='sol'?' sol':''; h+=`<div class="to${c}">${esc(l.v)}</div>`; }
  });
  body.innerHTML=h;
  body.scrollTop=body.scrollHeight;
}

function clrSt(){document.getElementById('t-st').textContent='';document.getElementById('t-st').className='tf-st';}

function selCat(id) {
  S.catId=id; S.exId=null; S.lines=[];
  rSidebar(); rExList(); rTerm(); clrSt();
  document.getElementById('b-nx').style.display='none';
  const cat=catMap[id];
  if(cat&&cat.exercises.length) selEx(cat.exercises[0].id);
}

function selEx(id) {
  S.exId=id; S.lines=[]; S.hidx=S.cmds.length; clrSt();
  document.getElementById('b-nx').style.display='none';
  rExList(); rTerm();
  const inp=document.getElementById('cmd-in');
  inp.value=''; inp.focus();
}

function submit(cmd) {
  const ex=exMap[S.exId]; if(!ex||!cmd.trim())return;
  S.cmds.push(cmd); S.hidx=S.cmds.length;
  S.lines.push({t:'cmd',v:cmd});
  if(ok(cmd,ex)) {
    if(ex.output!=null) S.lines.push({t:'ok',v:ex.output});
    S.lines.push({t:'ok',v:'✓ Correct !'});
    S.done.add(ex.id);
    document.getElementById('t-st').textContent='✓ Correct !';
    document.getElementById('t-st').className='tf-st ok';
    document.getElementById('b-nx').style.display='block';
    rSidebar(); rExList();
  } else {
    S.lines.push({t:'err',v:'bash: commande ou syntaxe incorrecte'});
    document.getElementById('t-st').textContent='✗ Incorrect';
    document.getElementById('t-st').className='tf-st err';
  }
  rTerm();
}

function doHint(){const ex=exMap[S.exId];if(!ex)return;S.lines.push({t:'hint',v:'💡 '+ex.hint});rTerm();}
function doSolution(){const ex=exMap[S.exId];if(!ex)return;S.lines.push({t:'sol',v:'→ '+ex.answers[0]});rTerm();}
function doReset(){
  if(!S.exId)return; S.done.delete(S.exId); S.lines=[]; clrSt();
  document.getElementById('b-nx').style.display='none';
  rSidebar(); rExList(); rTerm(); document.getElementById('cmd-in').focus();
}
function doNext(){
  const cat=catMap[S.catId]; if(!cat)return;
  const i=cat.exercises.findIndex(e=>e.id===S.exId);
  if(i<cat.exercises.length-1) selEx(cat.exercises[i+1].id);
  else { const ci=CATS.findIndex(c=>c.id===S.catId); if(ci<CATS.length-1) selCat(CATS[ci+1].id); }
}

document.getElementById('cmd-in').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value;e.target.value='';submit(v);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(S.hidx>0){S.hidx--;e.target.value=S.cmds[S.hidx]||'';}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(S.hidx<S.cmds.length-1){S.hidx++;e.target.value=S.cmds[S.hidx]||'';}else{S.hidx=S.cmds.length;e.target.value='';}}
});
document.getElementById('t-body').addEventListener('click',()=>document.getElementById('cmd-in').focus());

rSidebar(); rExList(); rTerm(); selCat('nav');
</script>
